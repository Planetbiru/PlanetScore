<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI to Music Score Renderer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f172a;
            --panel-bg: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
            --accent: #3b82f6;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            color: var(--text);
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ─── Toolbar Minimalis ─────────────────────────────── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
            flex-wrap: wrap;
        }

        .toolbar h1 {
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            margin-right: 0.5rem;
            white-space: nowrap;
        }

        .toolbar label {
            font-size: 0.8rem;
            color: var(--muted);
            white-space: nowrap;
        }

        .toolbar input[type="file"] {
            font-size: 0.8rem;
            max-width: 200px;
        }

        .toolbar select {
            font-size: 0.8rem;
            padding: 0.3rem 0.5rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--panel-bg);
            color: var(--text);
            font-family: inherit;
            max-width: 180px;
        }

        .toolbar select[multiple] {
            min-height: 80px;
            max-height: 120px;
        }

        .toolbar button {
            font-size: 0.8rem;
            padding: 0.35rem 0.75rem;
            border: 1px solid var(--border);
            background: var(--panel-bg);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
        }

        .toolbar button:hover:not(:disabled) {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .toolbar button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toolbar .spacer { flex: 1; }

        .toolbar .status {
            font-size: 0.75rem;
            color: var(--muted);
            white-space: nowrap;
        }

        /* Checkbox */
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.8rem;
            color: var(--text);
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            cursor: pointer;
        }

        /* Dropdown multi-select */
        .track-select-wrap {
            position: relative;
        }

        .track-select-trigger {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--panel-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-select-trigger:hover {
            border-color: var(--accent);
        }

        .track-select-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            z-index: 100;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            min-width: 220px;
            max-height: 300px;
            overflow-y: auto;
            padding: 0.25rem;
        }

        .track-select-dropdown.open {
            display: block;
        }

        .track-select-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.5rem;
            font-size: 0.8rem;
            color: var(--text);
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
        }

        .track-select-item:hover {
            background: #f1f5f9;
        }

        .track-select-item input[type="checkbox"] {
            cursor: pointer;
        }

        .track-select-actions {
            display: flex;
            gap: 0.5rem;
            padding: 0.4rem 0.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.25rem;
        }

        .track-select-actions button {
            font-size: 0.7rem;
            padding: 0.2rem 0.4rem;
        }

        /* ─── Split Layout ──────────────────────────────────── */
        .split-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .split-pane {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--panel-bg);
            min-width: 0;
        }

        .pane-left {
            flex: 1 1 50%;
            border-right: 2px solid var(--border);
        }

        .pane-right {
            flex: 1 1 50%;
        }

        .pane-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.75rem;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
        }

        .pane-body {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        .pane-body svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .pane-body iframe,
        .pane-body embed,
        .pane-body object,
        .pane-body canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }

        .placeholder {
            padding: 2rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* ─── Collapsible XML Output ────────────────────────── */
        .xml-bar {
            flex-shrink: 0;
            border-top: 1px solid var(--border);
            background: #f8fafc;
            max-height: 40px;
            transition: max-height 0.25s ease;
            overflow: hidden;
        }

        .xml-bar.open {
            max-height: 200px;
        }

        .xml-bar-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            user-select: none;
        }

        .xml-bar-toggle:hover {
            background: #f1f5f9;
        }

        .xml-bar-toggle .arrow {
            transition: transform 0.2s;
        }

        .xml-bar.open .xml-bar-toggle .arrow {
            transform: rotate(90deg);
        }

        .xml-content {
            padding: 0.5rem 0.75rem;
            font-family: monospace;
            font-size: 0.7rem;
            line-height: 1.4;
            color: var(--text);
            background: #fff;
            border-top: 1px solid var(--border);
            overflow: auto;
            max-height: 160px;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
        }

        .error {
            color: #dc2626;
            padding: 1rem;
            font-size: 0.85rem;
        }

        /* ─── Responsive ────────────────────────────────────── */
        @media (max-width: 768px) {
            .split-container {
                flex-direction: column;
            }
            .pane-left {
                border-right: none;
                border-bottom: 2px solid var(--border);
            }
            .toolbar h1 { display: none; }
        }
        #score-container{
            padding-bottom: 50px;
        }
    </style>
</head>
<body>

    <!-- Toolbar Minimalis -->
    <div class="toolbar">
        <h1>MIDI → Score</h1>
        <label for="midi-file-input">File:</label>
        <input type="file" id="midi-file-input" accept=".mid, .midi">

        <!-- Track selector -->
        <label>Track:</label>
        <div class="track-select-wrap">
            <button type="button" id="track-select-trigger" class="track-select-trigger" disabled>
                Semua Track
            </button>
            <div class="track-select-dropdown" id="track-select-dropdown">
                <div class="track-select-actions">
                    <button type="button" id="select-all-tracks">Pilih Semua</button>
                    <button type="button" id="clear-all-tracks">Kosongkan</button>
                </div>
                <div id="track-list"></div>
            </div>
        </div>

        <!-- AutoSplit toggle -->
        <label class="checkbox-label">
            <input type="checkbox" id="autosplit-toggle">
            Auto Split
        </label>

        <button id="download-pdf-btn" disabled>PDF</button>

        <div class="spacer"></div>
        <span class="status" id="status-label">Menunggu file…</span>
    </div>

    <!-- Split Layout: SVG (kiri) | PDF (kanan) -->
    <div class="split-container">

        <!-- Panel Kiri: SVG Score -->
        <div class="split-pane pane-left">
            <div class="pane-header">
                <span>SVG Score</span>
            </div>
            <div class="pane-body" id="score-container">
                <p class="placeholder">Partitur SVG akan muncul di sini…</p>
            </div>
            <div class="xml-bar" id="xml-bar">
                <div class="xml-bar-toggle" id="xml-bar-toggle">
                    <span class="arrow">▶</span>
                    <span>MusicXML</span>
                </div>
                <pre class="xml-content" id="xml-output-container">XML akan ditampilkan di sini…</pre>
            </div>
        </div>

        <!-- Panel Kanan: PDF Preview -->
        <div class="split-pane pane-right">
            <div class="pane-header">
                <span>PDF Preview</span>
            </div>
            <div class="pane-body" id="pdf-container">
                <p class="placeholder">Preview PDF akan muncul di sini setelah Anda klik tombol PDF.</p>
            </div>
        </div>

    </div>

    <!-- Dependensi -->
    <script src="MidiParser.js"></script>
    <script src="MidiToMusicXML.js"></script>
    <script src="MusicXMLSVGRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="MusicXMLPDFRenderer.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('midi-file-input');
            const scoreContainer = document.getElementById('score-container');
            const pdfContainer = document.getElementById('pdf-container');
            const xmlOutputContainer = document.getElementById('xml-output-container');
            const pdfButton = document.getElementById('download-pdf-btn');
            const statusLabel = document.getElementById('status-label');
            const xmlBar = document.getElementById('xml-bar');
            const xmlBarToggle = document.getElementById('xml-bar-toggle');

            const trackSelectTrigger = document.getElementById('track-select-trigger');
            const trackSelectDropdown = document.getElementById('track-select-dropdown');
            const trackListContainer = document.getElementById('track-list');
            const selectAllTracksBtn = document.getElementById('select-all-tracks');
            const clearAllTracksBtn = document.getElementById('clear-all-tracks');
            const autosplitToggle = document.getElementById('autosplit-toggle');

            // State
            let lastGeneratedXML = null;
            let currentMidiArrayBuffer = null;
            let currentFilename = null;
            let availableTracks = []; // [{ index, name, noteCount }]
            let selectedTrackIndices = []; // [] = semua track, [-1] = tidak ada

            // Inisialisasi renderer SVG
            const renderer = new MusicXMLSVGRenderer(scoreContainer, {
                systemSpacing: 120,
                staffSpacing: 120,
                partSpacing: 80
            });

            // ── Toggle XML bar ────────────────────────────────────
            xmlBarToggle.addEventListener('click', () => {
                xmlBar.classList.toggle('open');
            });

            // ── Track dropdown ────────────────────────────────────
            trackSelectTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                if (trackSelectTrigger.disabled) return;
                trackSelectDropdown.classList.toggle('open');
            });

            // Tutup dropdown saat klik di luar
            document.addEventListener('click', (e) => {
                if (!trackSelectDropdown.contains(e.target) && e.target !== trackSelectTrigger) {
                    trackSelectDropdown.classList.remove('open');
                }
            });

            selectAllTracksBtn.addEventListener('click', () => {
                selectedTrackIndices = [];
                updateTrackCheckboxes();
                updateTrackTriggerLabel();
                regenerate();
            });

            clearAllTracksBtn.addEventListener('click', () => {
                selectedTrackIndices = [-1]; // sentinel: tidak ada track
                updateTrackCheckboxes();
                updateTrackTriggerLabel();
                regenerate();
            });

            function updateTrackCheckboxes() {
                trackListContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    const idx = parseInt(cb.dataset.trackIndex, 10);
                    if (selectedTrackIndices.length === 0) {
                        cb.checked = true;
                    } else if (selectedTrackIndices.length === 1 && selectedTrackIndices[0] === -1) {
                        cb.checked = false;
                    } else {
                        cb.checked = selectedTrackIndices.includes(idx);
                    }
                });
            }

            function updateTrackTriggerLabel() {
                if (availableTracks.length === 0) {
                    trackSelectTrigger.textContent = 'Tidak ada track';
                    return;
                }
                if (selectedTrackIndices.length === 0) {
                    trackSelectTrigger.textContent = `Semua Track (${availableTracks.length})`;
                } else if (selectedTrackIndices.length === 1 && selectedTrackIndices[0] === -1) {
                    trackSelectTrigger.textContent = 'Tidak ada track dipilih';
                } else {
                    trackSelectTrigger.textContent = `${selectedTrackIndices.length} track dipilih`;
                }
            }

            function buildTrackList(tracks) {
                trackListContainer.innerHTML = '';
                tracks.forEach(t => {
                    const label = document.createElement('label');
                    label.className = 'track-select-item';
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.dataset.trackIndex = t.index;
                    cb.checked = true;
                    cb.addEventListener('change', () => {
                        if (cb.checked) {
                            if (selectedTrackIndices.length === 1 && selectedTrackIndices[0] === -1) {
                                selectedTrackIndices = [];
                            }
                            if (!selectedTrackIndices.includes(t.index)) {
                                selectedTrackIndices.push(t.index);
                            }
                        } else {
                            selectedTrackIndices = selectedTrackIndices.filter(i => i !== t.index);
                            if (selectedTrackIndices.length === 0) {
                                selectedTrackIndices = [-1];
                            }
                        }
                        updateTrackTriggerLabel();
                        regenerate();
                    });
                    const span = document.createElement('span');
                    span.textContent = `${t.index}. ${t.name}`;
                    label.appendChild(cb);
                    label.appendChild(span);
                    trackListContainer.appendChild(label);
                });
            }

            // ── AutoSplit toggle ──────────────────────────────────
            autosplitToggle.addEventListener('change', () => {
                regenerate();
            });

            // ── Dapatkan daftar track dari MIDI ───────────────────
            // Filter: hanya tampilkan track yang memiliki note (bukan meta track)
            function extractTracks(arrayBuffer) {
                try {
                    const parsed = MidiParser.parse(arrayBuffer, {
                        normalize: true,
                        forceUpdateEvents: true
                    });
                    return parsed.tracks
                        .map((t, i) => ({
                            index: i,
                            name: t.name || `Track ${i + 1}`,
                            noteCount: t.notes ? t.notes.length : 0,
                            channels: t.channels ? t.channels.slice() : [] // simpan channel
                        }))
                        .filter(t => t.noteCount > 0);
                } catch (err) {
                    console.error("Gagal parse MIDI:", err);
                    return [];
                }
            }

            // ── Regenerate MusicXML + SVG + PDF ──────────────────
            function regenerate() {
                if (!currentMidiArrayBuffer) return;

                try {
                    statusLabel.textContent = 'Memproses…';

                    const options = {
                        title: currentFilename.replace(/\.(mid|midi)$/i, ''),
                        creator: "MIDI Upload",
                        autoSplit: autosplitToggle.checked
                    };

                    // ── Tentukan channel yang dipilih ─────────────────
                    if (selectedTrackIndices.length === 1 && selectedTrackIndices[0] === -1) {
                        // Tidak ada track dipilih
                        statusLabel.textContent = 'Tidak ada track dipilih';
                        scoreContainer.innerHTML = '<p class="placeholder">Pilih minimal satu track.</p>';
                        pdfContainer.innerHTML = '<p class="placeholder">Tidak ada track dipilih.</p>';
                        xmlOutputContainer.textContent = '';
                        lastGeneratedXML = null;
                        pdfButton.disabled = true;
                        return;
                    }

                    // Jika user memilih subset track (bukan "Semua Track")
                    if (selectedTrackIndices.length > 0) {
                        const selectedChannels = new Set();
                        selectedTrackIndices.forEach(trackIdx => {
                            const track = availableTracks.find(t => t.index === trackIdx);
                            if (track && track.channels) {
                                track.channels.forEach(ch => selectedChannels.add(ch));
                            }
                        });

                        if (selectedChannels.size > 0) {
                            options.selectedChannels = Array.from(selectedChannels);
                        } else {
                            // Track dipilih tapi tidak punya channel (kemungkinan meta track)
                            // → fallback: kirim track sebagai selectedTrack
                            options.selectedTracks = selectedTrackIndices.slice();
                        }
                    }
                    // Jika selectedTrackIndices.length === 0, tidak kirim apa-apa (semua)

                    const musicXML = MidiToMusicXML.convert(currentMidiArrayBuffer, options);
                    lastGeneratedXML = musicXML;
                    pdfButton.disabled = false;
                    xmlOutputContainer.textContent = musicXML;

                    // Render SVG
                    scoreContainer.innerHTML = '';
                    renderer.render(musicXML);

                    // Generate PDF
                    pdfContainer.innerHTML = '<p class="placeholder">Membuat PDF…</p>';
                    setTimeout(() => generatePDF(), 100);

                    statusLabel.textContent = 'Siap';
                } catch (error) {
                    console.error("Gagal memproses:", error);
                    scoreContainer.innerHTML = `<p class="error">Terjadi kesalahan: ${error.message}</p>`;
                    statusLabel.textContent = 'Gagal';
                }
            }

            // ── Proses awal saat file dimuat ─────────────────────
            function processArrayBuffer(arrayBuffer, filename) {
                currentMidiArrayBuffer = arrayBuffer;
                currentFilename = filename;

                // Ekstrak daftar track (meta track difilter)
                availableTracks = extractTracks(arrayBuffer);

                // Reset pilihan ke "Semua Track"
                selectedTrackIndices = [];
                buildTrackList(availableTracks);
                updateTrackTriggerLabel();
                trackSelectTrigger.disabled = availableTracks.length === 0;
                trackSelectDropdown.classList.remove('open');

                // Render
                regenerate();
            }

            function generatePDF() {
                if (!lastGeneratedXML) {
                    alert("Silakan unggah file MIDI terlebih dahulu.");
                    return;
                }
                try {
                    statusLabel.textContent = 'Membuat PDF…';
                    const pdfRenderer = new MusicXMLPDFRenderer();
                    pdfRenderer.render(lastGeneratedXML);

                    const pdfBlob = pdfRenderer.doc.output('blob');
                    const pdfUrl = URL.createObjectURL(pdfBlob);

                    pdfContainer.innerHTML = '';
                    const iframe = document.createElement('iframe');
                    iframe.src = pdfUrl;
                    iframe.title = 'PDF Preview';
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    pdfContainer.appendChild(iframe);

                    pdfButton.dataset.pdfUrl = pdfUrl;
                    statusLabel.textContent = 'PDF siap';
                } catch (error) {
                    console.error("Gagal membuat PDF:", error);
                    pdfContainer.innerHTML = `<p class="error">Gagal membuat PDF: ${error.message}</p>`;
                    statusLabel.textContent = 'PDF gagal';
                }
            }

            // ── File input handler ────────────────────────────────
            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (!file) return;
                statusLabel.textContent = `Membaca ${file.name}…`;
                const reader = new FileReader();
                reader.onload = (e) => processArrayBuffer(e.target.result, file.name);
                reader.readAsArrayBuffer(file);
            });

            pdfButton.addEventListener('click', () => generatePDF());

            // ── Auto-load Tenggelam.mid via AJAX ──────────────────
            const autoLoadUrl = 'Tenggelam.mid';
            statusLabel.textContent = `Memuat ${autoLoadUrl}…`;
            scoreContainer.innerHTML = `<p class="placeholder">Memuat ${autoLoadUrl}…</p>`;

            fetch(autoLoadUrl)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    return response.arrayBuffer();
                })
                .then(arrayBuffer => processArrayBuffer(arrayBuffer, 'Tenggelam.mid'))
                .catch(err => {
                    console.error("Gagal auto-load MIDI:", err);
                    scoreContainer.innerHTML = `<p class="placeholder">Auto-load gagal: ${err.message}. Gunakan file input di atas.</p>`;
                    statusLabel.textContent = 'Auto-load gagal';
                });
        });
    </script>
</body>
</html>
